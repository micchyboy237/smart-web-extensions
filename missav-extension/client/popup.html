<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissAV Smart Search</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <div class="header">
        <h1>
          <span class="header-icon"><i class="fas fa-film"></i></span>
          MissAV Smart Search
        </h1>
        <div class="header-actions">
          <span id="resultCount" class="result-badge hidden">0 results</span>
          <button id="themeToggle" class="icon-button" title="Toggle Dark Mode">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>

      <!-- Main Content: Two Columns -->
      <div class="main-content">
        <!-- Left Column: Search Form -->
        <div class="search-column">
          <!-- Search Query -->
          <div class="form-group">
            <label for="query">
              <i class="fas fa-search"></i> Search Query
            </label>
            <div class="search-input-wrapper">
              <input
                type="text"
                id="query"
                placeholder="e.g., 'popular juq videos from 300-500' or 'mxgs -fc2'"
                autocomplete="off"
              />
              <button
                id="clearQuery"
                class="icon-button clear-btn"
                title="Clear"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
            <small class="hint"
              >Natural language, codes (juq, mxgs), filters (-fc2)</small
            >
          </div>

          <!-- Top K and Search Type -->
          <div class="form-row">
            <div class="form-group">
              <label for="topK">Results</label>
              <input type="number" id="topK" min="1" max="100" value="20" />
            </div>
            <div class="form-group">
              <label for="searchType">Search Type</label>
              <select id="searchType">
                <option value="semantic">Semantic</option>
                <option value="hybrid">Hybrid</option>
                <option value="keyword">Keyword</option>
                <option value="ensemble">Ensemble</option>
              </select>
            </div>
          </div>

          <!-- Include/Exclude Codes -->
          <div class="form-row">
            <div class="form-group">
              <label for="includeCodes">Include Codes</label>
              <div class="multi-select">
                <input
                  type="text"
                  id="includeCodesFilter"
                  placeholder="Filter codes..."
                  class="filter-input"
                />
                <select id="includeCodes" multiple size="4"></select>
              </div>
            </div>
            <div class="form-group">
              <label for="excludeCodes">Exclude Codes</label>
              <div class="multi-select">
                <input
                  type="text"
                  id="excludeCodesFilter"
                  placeholder="Filter codes..."
                  class="filter-input"
                />
                <select id="excludeCodes" multiple size="4"></select>
              </div>
            </div>
          </div>

          <!-- Episode Range and Diversity -->
          <div class="form-row">
            <div class="form-group">
              <label for="episodeRange">Episode Range</label>
              <div class="range-inputs">
                <input
                  type="number"
                  id="episodeMin"
                  placeholder="Min"
                  min="0"
                />
                <span class="range-separator">—</span>
                <input
                  type="number"
                  id="episodeMax"
                  placeholder="Max"
                  min="0"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="diversityFactor">Diversity</label>
              <div class="slider-container">
                <input
                  type="range"
                  id="diversityFactor"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.3"
                />
                <div class="slider-labels">
                  <span>Relevance</span>
                  <span id="diversityValue">0.3</span>
                  <span>Diversity</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Max Per Code -->
          <div class="form-group">
            <label for="maxPerCode">Max per Code</label>
            <input
              type="number"
              id="maxPerCode"
              min="1"
              placeholder="Unlimited"
            />
          </div>

          <!-- Limit to Current Page Toggle -->
          <div class="form-group">
            <label for="limitToPage">
              <i class="fas fa-filter"></i> Limit to Current Page
            </label>
            <div class="toggle-row">
              <label class="switch">
                <input type="checkbox" id="limitToPage" />
                <span class="slider round"></span>
              </label>
              <span class="toggle-label">Only search videos on this page</span>
            </div>
            <small
              class="hint"
              id="pageVideoCount"
              style="display: none"
            ></small>
          </div>

          <!-- Action Buttons-->
          <div class="button-group">
            <button id="smartSearchBtn" class="primary-button">
              <i class="fas fa-search"></i> Smart Search
            </button>
            <button id="findSimilarBtn" class="secondary-button">
              <i class="fas fa-random"></i> Similar
            </button>
          </div>
        </div>

        <!-- Right Column: Results List -->
        <div class="results-column">
          <div class="results-header">
            <h2><i class="fas fa-list"></i> Results</h2>
            <button
              id="copyAllIds"
              class="icon-button"
              title="Copy all video IDs"
            >
              <i class="fas fa-copy"></i>
            </button>
          </div>
          <div id="resultsContainer" class="results-container">
            <div class="empty-results">
              <div class="empty-icon"><i class="fas fa-film"></i></div>
              <p class="empty-title">No results yet</p>
              <p class="empty-subtitle">
                Enter a query and click "Smart Search"
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner">
          <i class="fas fa-spinner fa-spin"></i>
          <span>Searching...</span>
        </div>
      </div>

      <!-- Toast Notifications -->
      <div id="toast" class="toast hidden"></div>
    </div>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
