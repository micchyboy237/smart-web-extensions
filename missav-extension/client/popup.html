<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissAV Smart Search</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>MissAV Smart Search</h1>

      <!-- Search Query -->
      <div class="form-group">
        <label for="query">Search Query</label>
        <input
          type="text"
          id="query"
          placeholder="e.g., 'popular juq videos from 300-500'"
        />
      </div>

      <!-- Top K Results -->
      <div class="form-group">
        <label for="topK">Results to Return (1-100)</label>
        <input type="number" id="topK" min="1" max="100" value="20" />
      </div>

      <!-- Include Codes -->
      <div class="form-group">
        <label for="includeCodes">Include Codes (e.g., juq, mxgs)</label>
        <select id="includeCodes" multiple>
          <!-- Populated dynamically in popup.js -->
        </select>
      </div>

      <!-- Exclude Codes -->
      <div class="form-group">
        <label for="excludeCodes">Exclude Codes</label>
        <select id="excludeCodes" multiple>
          <!-- Populated dynamically in popup.js -->
        </select>
      </div>

      <!-- Episode Range -->
      <div class="form-group">
        <label for="episodeRange">Episode Range</label>
        <div class="range-inputs">
          <input type="number" id="episodeMin" placeholder="Min" min="0" />
          <span>to</span>
          <input type="number" id="episodeMax" placeholder="Max" min="0" />
        </div>
      </div>

      <!-- Diversity Factor -->
      <div class="form-group">
        <label for="diversityFactor"
          >Diversity (0 = Relevance, 1 = Diversity)</label
        >
        <input
          type="range"
          id="diversityFactor"
          min="0"
          max="1"
          step="0.1"
          value="0.3"
        />
        <span id="diversityValue">0.3</span>
      </div>

      <!-- Max Per Code -->
      <div class="form-group">
        <label for="maxPerCode">Max Results per Code</label>
        <input type="number" id="maxPerCode" min="1" placeholder="Optional" />
      </div>

      <!-- Search Type -->
      <div class="form-group">
        <label for="searchType">Search Type</label>
        <select id="searchType">
          <option value="hybrid">Hybrid (Default)</option>
          <option value="semantic">Semantic</option>
          <option value="keyword">Keyword</option>
          <option value="ensemble">Ensemble</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="smartSearchBtn">Smart Search</button>
        <button id="quickSearchBtn">Quick Search</button>
        <button id="findSimilarBtn">Find Similar</button>
        <button id="serverStatusBtn">Server Status</button>
      </div>

      <!-- Results Container -->
      <div id="resultsContainer" class="results-container"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
