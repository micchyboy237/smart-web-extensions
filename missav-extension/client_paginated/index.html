<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MissAV Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: {
                950: "#0a0c11",
                900: "#0f1218",
                800: "#151a23",
                700: "#1d2430",
                600: "#293241",
              },
              accent: { 400: "#7db4ff", 500: "#5a9cff", 600: "#3b82f6" },
              violet: { 500: "#a78bfa" },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(90,156,255,.25), 0 8px 32px -8px rgba(90,156,255,.45)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
    ></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-ink-950 text-slate-200 min-h-screen bg-grain antialiased"
    x-data="app()"
    x-init="boot()"
    x-cloak
  >
    <!-- ═══════════════════ TOP NAV ═══════════════════ -->
    <header
      class="sticky top-0 z-30 border-b border-white/5 bg-ink-950/80 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex max-w-[1600px] items-center gap-4 px-4 py-3 md:px-6"
      >
        <a href="/" class="flex shrink-0 items-center gap-2">
          <div
            class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-accent-500 to-violet-500 shadow-glow"
          >
            <i data-lucide="film" class="h-5 w-5 text-white"></i>
          </div>
          <span class="hidden text-lg font-extrabold tracking-tight sm:inline">
            MissAV<span class="text-accent-400">.</span>Explorer
          </span>
        </a>

        <!-- Dynamic Search Bar -->
        <form
          @submit.prevent="mode === 'topics' ? fetchTopicSearch() : doSearch()"
          class="flex flex-1 items-center gap-2"
        >
          <!-- Standard Search Input -->
          <div x-show="mode !== 'topics'" class="relative flex-1 max-w-2xl">
            <i
              data-lucide="search"
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
            ></i>
            <input
              x-ref="searchInput"
              x-model="query"
              @input.debounce.400ms="onQueryInput()"
              type="search"
              placeholder="Describe what you want..."
              class="w-full rounded-xl border border-white/10 bg-ink-800/70 py-2.5 pl-10 pr-24 text-sm text-slate-100 placeholder:text-slate-500 transition focus:border-accent-500/60 focus:bg-ink-800 focus:outline-none focus:ring-2 focus:ring-accent-500/30"
            />
            <kbd
              class="pointer-events-none absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-md border border-white/10 bg-ink-900 px-1.5 py-0.5 text-[10px] font-medium text-slate-500 sm:inline"
              >/</kbd
            >
          </div>

          <!-- Topic Search Input -->
          <div x-show="mode === 'topics'" class="relative flex-1 max-w-2xl">
            <i
              data-lucide="layers"
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-violet-500"
            ></i>
            <input
              x-ref="topicSearchInput"
              x-model="topics.searchQuery"
              type="search"
              placeholder="Search topics by keyword (e.g. 'wife', 'office')..."
              class="w-full rounded-xl border border-white/10 bg-ink-800/70 py-2.5 pl-10 pr-10 text-sm text-slate-100 placeholder:text-slate-500 transition focus:border-violet-500/60 focus:bg-ink-800 focus:outline-none focus:ring-2 focus:ring-violet-500/30"
            />
            <button
              x-show="topics.searchQuery"
              @click.prevent="clearTopicSearch()"
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"
            >
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>

          <button
            type="submit"
            x-show="mode !== 'topics'"
            class="hidden items-center gap-1.5 rounded-xl bg-accent-500 px-4 py-2.5 text-sm font-semibold text-ink-950 shadow-glow transition hover:bg-accent-400 active:scale-[.98] sm:flex"
          >
            <i data-lucide="sparkles" class="h-4 w-4"></i> Search
          </button>
        </form>

        <!-- Back Button for Similar Mode -->
        <button
          x-show="mode === 'similar'"
          @click="goBack()"
          class="flex items-center gap-1.5 rounded-xl border border-white/10 px-3 py-2 text-sm font-semibold text-slate-300 transition hover:bg-white/5"
          title="Go Back"
        >
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          <span class="hidden sm:inline">Back</span>
        </button>

        <!-- Topic Mode Toggle -->
        <button
          @click="toggleTopicMode()"
          :class="mode === 'topics' ? 'bg-violet-500 text-ink-950 shadow-glow' : 'border border-white/10 text-slate-300 hover:border-white/20 hover:bg-white/5'"
          class="hidden items-center gap-1.5 rounded-xl px-4 py-2.5 text-sm font-semibold transition md:flex"
        >
          <i data-lucide="layers" class="h-4 w-4"></i>
          <span>Topics</span>
        </button>

        <!-- Add Code Button -> Opens Codes Modal -->
        <button
          @click="codesModalOpen = true"
          class="hidden items-center gap-1.5 rounded-xl border border-white/10 px-3 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-white/20 hover:bg-white/5 md:flex"
          title="Filter by Series Code"
        >
          <i data-lucide="hash" class="h-4 w-4"></i>
          <span class="hidden lg:inline">Filter Code</span>
        </button>

        <div class="hidden items-center gap-2 md:flex">
          <span
            class="flex items-center gap-1.5 rounded-full border border-white/10 bg-ink-800/60 px-2.5 py-1 text-[11px] font-medium text-slate-400"
          >
            <span
              class="h-1.5 w-1.5 rounded-full"
              :class="online ? 'bg-emerald-400' : 'bg-rose-500'"
              :class="online ? 'animate-pulse' : ''"
            ></span>
            <span x-text="online ? 'live' : 'offline'"></span>
          </span>
        </div>

        <button
          @click="filtersOpen = !filtersOpen"
          class="rounded-xl border border-white/10 p-2.5 text-slate-300 lg:hidden"
        >
          <i data-lucide="sliders-horizontal" class="h-4 w-4"></i>
        </button>
      </div>
    </header>

    <!-- ═══════════════════ MAIN LAYOUT ═══════════════════ -->
    <div
      class="relative z-10 mx-auto flex max-w-[1600px] gap-6 px-4 py-6 md:px-6"
    >
      <!-- ─── Filter sidebar ─── -->
      <aside
        :class="filtersOpen ? 'fixed inset-0 z-40 flex justify-end bg-black/60 backdrop-blur-sm lg:static lg:z-auto lg:block lg:bg-transparent lg:backdrop-blur-none' : 'hidden lg:block'"
        class="w-full shrink-0 lg:w-72"
      >
        <div
          class="h-full w-full max-w-sm overflow-y-auto border-l border-white/10 bg-ink-900 p-5 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:rounded-2xl lg:border"
        >
          <div class="mb-4 flex items-center justify-between">
            <h2
              class="flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-slate-400"
            >
              <i data-lucide="sliders-horizontal" class="h-4 w-4"></i> Filters
            </h2>
            <button
              @click="filtersOpen = false"
              class="rounded-lg p-1 text-slate-500 hover:bg-white/5 lg:hidden"
            >
              <i data-lucide="x" class="h-5 w-5"></i>
            </button>
          </div>

          <!-- Series Code Autocomplete -->
          <label class="mb-4 block relative">
            <span class="mb-1.5 block text-xs font-medium text-slate-500"
              >Series code</span
            >
            <div class="relative">
              <i
                data-lucide="tag"
                class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-500"
              ></i>
              <input
                x-model="codeInput"
                @focus="onCodeInputFocus()"
                @blur="onCodeInputBlur()"
                @input="updateCodeSuggestions()"
                placeholder="Type to search..."
                class="w-full rounded-lg border border-white/10 bg-ink-800 py-2 pl-9 pr-3 text-sm text-slate-100 placeholder:text-slate-600 focus:border-accent-500/60 focus:outline-none"
              />
              <div
                x-show="showCodeDropdown && codeSuggestions.length > 0"
                class="absolute z-50 mt-1 w-full max-h-60 overflow-y-auto rounded-lg border border-white/10 bg-ink-800 shadow-xl"
                style="display: none"
              >
                <template
                  x-for="codeObj in codeSuggestions"
                  :key="codeObj.code"
                >
                  <div
                    @click="addCodeChip(codeObj)"
                    class="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-white/5 text-sm"
                  >
                    <span
                      class="font-mono text-accent-300"
                      x-text="codeObj.code"
                    ></span>
                    <span
                      class="text-xs text-slate-500"
                      x-text="formatCount(codeObj.count)"
                    ></span>
                  </div>
                </template>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 mt-2 mb-2">
              <template x-if="filters.code">
                <template
                  x-for="code in filters.code.split(',').map(c => c.trim()).filter(Boolean)"
                  :key="code"
                >
                  <span
                    class="inline-flex items-center gap-1 rounded-full bg-violet-500/20 border border-violet-500/30 px-2 py-0.5 text-xs text-violet-200"
                  >
                    <span x-text="code"></span>
                    <button
                      @click="removeCodeChip(code)"
                      class="hover:text-white"
                    >
                      <i data-lucide="x" class="h-3 w-3"></i>
                    </button>
                  </span>
                </template>
              </template>
            </div>
            <button
              @click="codesModalOpen = true"
              class="w-full text-xs text-accent-400 hover:text-accent-300 font-medium flex items-center justify-center gap-1 py-1 mb-4"
            >
              <i data-lucide="list" class="h-3 w-3"></i> Show All Codes
            </button>
          </label>

          <!-- Data Status -->
          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
              ><i data-lucide="check-square" class="h-3.5 w-3.5"></i> Data
              status</span
            >
            <div
              class="flex rounded-lg border border-white/10 bg-ink-800 p-1 text-xs"
            >
              <button
                @click="setCompletionFilter('all')"
                :class="filters.completionFilter === 'all' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                All
              </button>
              <button
                @click="setCompletionFilter('complete')"
                :class="filters.completionFilter === 'complete' ? 'bg-emerald-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Complete
              </button>
              <button
                @click="setCompletionFilter('incomplete')"
                :class="filters.completionFilter === 'incomplete' ? 'bg-amber-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Incomplete
              </button>
            </div>
          </div>

          <!-- Date Range -->
          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
              ><i data-lucide="calendar-range" class="h-3.5 w-3.5"></i> Released
              between</span
            >
            <div class="grid grid-cols-2 gap-2">
              <input
                type="date"
                x-model="filters.from"
                @change="mode !== 'topics' && refetch()"
                class="rounded-lg border border-white/10 bg-ink-800 px-2.5 py-2 text-xs text-slate-100 focus:border-accent-500/60 focus:outline-none [color-scheme:dark]"
              />
              <input
                type="date"
                x-model="filters.to"
                @change="mode !== 'topics' && refetch()"
                class="rounded-lg border border-white/10 bg-ink-800 px-2.5 py-2 text-xs text-slate-100 focus:border-accent-500/60 focus:outline-none [color-scheme:dark]"
              />
            </div>
          </div>

          <!-- Genre Match -->
          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
              ><i data-lucide="git-merge" class="h-3.5 w-3.5"></i> Genre
              match</span
            >
            <div
              class="flex rounded-lg border border-white/10 bg-ink-800 p-1 text-xs"
            >
              <button
                @click="filters.genresMode = 'any'; mode !== 'topics' && refetch()"
                :class="filters.genresMode === 'any' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Any of
              </button>
              <button
                @click="filters.genresMode = 'all'; mode !== 'topics' && refetch()"
                :class="filters.genresMode === 'all' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                All of
              </button>
            </div>
          </div>

          <!-- Genres -->
          <div class="mb-4">
            <span
              class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500"
            >
              <span class="flex items-center gap-1.5"
                ><i data-lucide="drama" class="h-3.5 w-3.5"></i> Genres</span
              >
              <span
                class="text-[10px] text-slate-600"
                x-text="`${filters.genres.length} selected`"
              ></span>
            </span>
            <div
              class="max-h-32 overflow-y-auto flex flex-wrap gap-1.5 mb-2 pr-1 custom-scrollbar"
            >
              <template x-for="g in facets.genres" :key="g.name">
                <button
                  @click="toggleGenre(g.name)"
                  :class="filters.genres.includes(g.name) ? 'border-accent-500 bg-accent-500/15 text-accent-300' : 'border-white/10 bg-ink-800 text-slate-400 hover:border-white/20 hover:text-slate-200'"
                  class="rounded-full border px-2.5 py-1 text-[11px] font-medium transition whitespace-nowrap"
                  :title="`${formatCount(g.count)} videos`"
                >
                  <span x-text="g.name"></span>
                  <span
                    class="ml-1 text-[9px] opacity-60"
                    x-text="formatCount(g.count)"
                  ></span>
                </button>
              </template>
            </div>
            <button
              @click="genresModalOpen = true"
              class="w-full text-xs text-accent-400 hover:text-accent-300 font-medium flex items-center justify-center gap-1 py-1"
            >
              <i data-lucide="list" class="h-3 w-3"></i> Show All Genres
            </button>
          </div>

          <!-- Quick Year -->
          <div class="mb-4">
            <span
              class="mb-2 flex items-center gap-1.5 text-xs font-medium text-slate-500"
              ><i data-lucide="calendar" class="h-3.5 w-3.5"></i> Quick
              year</span
            >
            <div class="flex flex-wrap gap-1">
              <template x-for="y in recentYears()" :key="y.year">
                <button
                  @click="pickYear(y.year)"
                  :class="filters.from === y.year+'-01-01' && filters.to === y.year+'-12-31' ? 'border-violet-500 bg-violet-500/20 text-violet-300' : 'border-white/10 bg-ink-800 text-slate-400 hover:text-slate-200'"
                  class="rounded-md border px-2 py-1 text-[11px] font-medium transition"
                  :title="`${formatCount(y.count)} videos`"
                  x-text="y.year"
                ></button>
              </template>
            </div>
          </div>

          <button
            @click="clearFilters()"
            class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-lg border border-white/10 py-2 text-xs font-semibold text-slate-400 transition hover:border-rose-500/40 hover:bg-rose-500/10 hover:text-rose-300"
          >
            <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i> Clear all
            filters
          </button>
        </div>
      </aside>

      <!-- ─── Results ─── -->
      <section class="min-w-0 flex-1">
        <!-- ═══════════════════ TOPIC MODE ═══════════════════ -->
        <div x-show="mode === 'topics'" x-cloak>
          <div class="mb-5 flex items-center justify-between gap-3">
            <!-- Fixed Alignment for Breadcrumb -->
            <div class="flex items-center gap-2 text-sm">
              <button
                @click="closeTopicDetail()"
                class="flex items-center gap-1 text-slate-400 hover:text-white transition"
                x-show="topics.currentRun"
              >
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                <span>Back to Dashboard</span>
              </button>

              <template x-if="!topics.currentRun && topics.searchQuery">
                <button
                  @click="clearTopicSearch()"
                  class="flex items-center gap-1 text-slate-400 hover:text-white transition"
                >
                  <i data-lucide="arrow-left" class="h-4 w-4"></i>
                  <span>Back to Dashboard</span>
                </button>
              </template>

              <template x-if="topics.currentRun">
                <div class="flex items-center gap-2">
                  <span class="text-slate-600">/</span>
                  <span
                    class="font-bold text-slate-200"
                    x-text="topics.currentRun.run.code"
                  ></span>
                </div>
              </template>

              <template x-if="topics.searchQuery && !topics.currentRun">
                <div class="flex items-center gap-2">
                  <span class="text-slate-600">/</span>
                  <span class="font-bold text-slate-200"
                    >Search: "<span x-text="topics.searchQuery"></span>"</span
                  >
                </div>
              </template>
            </div>
          </div>

          <!-- Topic Dashboard Grid (Only show if no search query and no current run) -->
          <div x-show="!topics.currentRun && !topics.searchQuery">
            <div
              x-show="topics.loading"
              class="grid gap-4"
              style="
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
              "
            >
              <template x-for="i in 6" :key="i"
                ><div class="h-48 skeleton rounded-2xl"></div
              ></template>
            </div>
            <div
              x-show="!topics.loading && topics.error"
              class="text-center py-12 text-rose-400"
            >
              <p x-text="topics.error"></p>
            </div>
            <div
              x-show="!topics.loading && !topics.error"
              class="grid gap-4"
              style="
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
              "
            >
              <template x-for="topic in topics.dashboard" :key="topic.run_id">
                <div
                  @click="openTopicDetail(topic.run_id)"
                  class="group cursor-pointer overflow-hidden rounded-2xl border border-white/10 bg-ink-900 transition hover:border-violet-500/50 hover:shadow-glow"
                >
                  <div class="p-4">
                    <div class="flex items-start justify-between">
                      <div>
                        <h3
                          class="font-bold text-slate-100"
                          x-text="topic.code.toUpperCase()"
                        ></h3>
                        <p
                          class="text-xs text-slate-500"
                          x-text="topic.created_at.slice(0, 10)"
                        ></p>
                      </div>
                      <span
                        class="rounded-full bg-violet-500/20 px-2 py-0.5 text-[10px] font-bold text-violet-300"
                      >
                        <span x-text="topic.n_topics"></span> Topics
                      </span>
                    </div>
                    <div class="mt-3">
                      <p
                        class="text-sm font-medium text-accent-300"
                        x-text="topic.top_topic_name || 'Unnamed Topic'"
                      ></p>
                      <div class="mt-2 flex flex-wrap gap-1">
                        <template
                          x-for="w in topic.top_topic_words.slice(0, 3)"
                          :key="w.word"
                        >
                          <span
                            class="rounded bg-ink-800 px-1.5 py-0.5 text-[10px] text-slate-400"
                            x-text="w.word"
                          ></span>
                        </template>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Topic Search Results -->
          <div x-show="topics.searchQuery && !topics.currentRun" x-cloak>
            <div
              x-show="topics.loading"
              class="grid gap-4"
              style="
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
              "
            >
              <template x-for="i in 4" :key="i"
                ><div class="h-64 skeleton rounded-2xl"></div
              ></template>
            </div>

            <div
              x-show="!topics.loading && topics.error"
              class="text-center py-12 text-rose-400"
            >
              <p x-text="topics.error"></p>
            </div>

            <div
              x-show="!topics.loading && !topics.error && topics.searchResults.length === 0"
              class="text-center py-12 text-slate-500"
            >
              <p>
                No topics found for "<span x-text="topics.searchQuery"></span>"
              </p>
            </div>

            <div
              x-show="!topics.loading && !topics.error && topics.searchResults.length > 0"
              class="space-y-6"
            >
              <template
                x-for="result in topics.searchResults"
                :key="result.run_id + '-' + result.topic_id"
              >
                <div
                  class="rounded-2xl border border-white/10 bg-ink-900 p-5 transition hover:border-violet-500/30"
                >
                  <div
                    class="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-4"
                  >
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <h2
                          class="text-lg font-bold text-violet-300"
                          x-text="result.topic_name || 'Untitled Topic'"
                        ></h2>
                        <span
                          class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-400 font-mono"
                          x-text="result.code"
                        ></span>
                      </div>
                      <p class="text-xs text-slate-500">
                        <span x-text="result.representative_doc_count"></span>
                        videos · Relevance:
                        <span
                          class="text-accent-400"
                          x-text="(result.relevance_score * 100).toFixed(1) + '%'"
                        ></span>
                      </p>
                    </div>

                    <!-- Keywords / Matched N-grams -->

                    <video
                      :src="v.preview"
                      :id="`preview-home-0-${v.id}`"

                      class="preview absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-110"
                      loop
                      muted
                      playsinline
                      preload="none"
                      @error="previewError(`home-0-${v.id}`)"

                    ></video>
                    <img
                      :src="v.thumbnail"
                      :alt="v.title"
                      :class="{ hidden: isPreviewActive(`home-0-${v.id}`) }"
                      loading="lazy"
                      decoding="async"
                      class="absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-110"
                      @error="$el.style.opacity = .2"
                    />

                        </button>
                        <button
                          @stop="findSimilar(v.id)"

                          <i data-lucide="orbit" class="h-3.5 w-3.5"></i>
                        </button>

                          :href="v.url"

                          rel="noopener"

                          title="Open Source"
                        >
                          <i
                            data-lucide="external-link"
                            class="h-3.5 w-3.5"
                          ></i>
                        </a>
                      </div>
                    </div>
                  </div>
                  <div class="p-3">
                    <h3
                      @click="openDetail(v.id)"
                      class="line-clamp-2 min-h-[2.4em] cursor-pointer text-[13px] font-semibold leading-snug text-slate-100 transition group-hover:text-accent-300"
                      x-text="v.title || '(untitled)'"
                    ></h3>
                    <div
                      class="mt-1 flex items-center gap-1.5 text-[11px] text-slate-500"
                    >
                      <span
                        class="rounded bg-ink-700 px-1.5 py-0.5 font-mono text-[10px] text-accent-300"
                        x-text="v.code"
                      ></span>
                      <span x-text="v.episode"></span>
                    </div>
                    <div class="mt-2 flex flex-wrap gap-1">
                      <template
                        x-for="g in (v.genres ?? []).slice(0, 2)"

                        <span
                          class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-500"

                        ></span>
                      </template>
                      <span

                        x-text="`+${(v.genres?.length ?? 0) - 2}`"
                      ></span>
                    </div>
                  </div>
                </article>
              </template>
            </div>
            <div
              x-show="!loading && items.length === 0"
              class="flex flex-col items-center justify-center py-24 text-center"
            >
              <div
                class="grid h-16 w-16 place-items-center rounded-2xl bg-ink-800 text-slate-500"
              >
                <i data-lucide="ghost" class="h-8 w-8"></i>
              </div>
              <h3 class="mt-4 text-lg font-semibold text-slate-300">
                No results
              </h3>
              <p class="mt-1 max-w-sm text-sm text-slate-500">
                Try removing some filters, or rephrase your query.
              </p>
              <button
                @click="clearFilters()"

            </div>
            <div

            >

                class="flex items-center gap-2 rounded-xl border border-white/10 bg-ink-800 px-5 py-2.5 text-sm font-semibold text-slate-200 transition hover:border-accent-500/40 hover:bg-ink-700 disabled:opacity-50"

                ></template>
                <span x-text="loading ? 'Loading…' : 'Load more'"></span>
              </button>
              <p x-show="exhausted" class="text-xs text-slate-600">

              </p>
            </div>
          </div>
          <div x-ref="sentinel" class="h-1"></div>
        </div>
      </section>
    </div>

            </div>
            <div class="max-h-[50vh] overflow-y-auto p-5">
              <div class="mb-2 flex items-center gap-2 text-xs text-slate-500">
                <span
                  class="rounded bg-ink-800 px-2 py-0.5 font-mono text-accent-300"
                  x-text="detail.video.code"
                ></span>
                <span x-text="detail.video.episode"></span>
                <span
                  x-show="detail.video.release_date"
                  x-text="'· ' + detail.video.release_date?.slice(0,10)"
                ></span>
              </div>
              <h2
                class="text-xl font-bold text-slate-100"
                x-text="detail.video.title || '(untitled)'"
              ></h2>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <template x-for="g in (detail.video.genres || [])" :key="g">
                  <span
                    @click="closeDetail(); filters.genres=[g]; mode !== 'topics' && refetch()"
                    class="cursor-pointer rounded-full border border-white/10 bg-ink-800 px-2.5 py-0.5 text-[11px] text-slate-400 transition hover:border-accent-500/40 hover:text-accent-300"
                    x-text="g"
                  ></span>
                </template>
              </div>
              <p
                x-show="detail.video.details"
                class="mt-4 whitespace-pre-wrap text-sm leading-relaxed text-slate-400"
                x-text="detail.video.details"
              ></p>
              <div class="mt-5 flex flex-wrap gap-2">
                <a
                  :href="detail.video.url"
                  target="_blank"
                  rel="noopener"
                  class="flex items-center gap-1.5 rounded-lg bg-accent-500 px-4 py-2 text-sm font-bold text-ink-950 transition hover:bg-accent-400"
                >
                  <i data-lucide="external-link" class="h-4 w-4"></i> Open
                  source
                </a>
                <button
                  @click="findSimilar(detail.video.id)"
                  class="flex items-center gap-1.5 rounded-lg border border-white/10 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-white/5"
                >
                  <i data-lucide="orbit" class="h-4 w-4"></i> Find similar
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ═══════════════════ TOASTS ═══════════════════ -->
    <div
      class="pointer-events-none fixed bottom-4 right-4 z-[60] flex flex-col gap-2"
    >
      <template x-for="t in toasts" :key="t.id">
        <div
          class="pointer-events-auto flex items-start gap-2 rounded-xl border px-3 py-2.5 text-sm shadow-lg backdrop-blur-md"
          :class="{
        'border-rose-500/30 bg-rose-950/80 text-rose-200': t.type === 'error',
        'border-emerald-500/30 bg-emerald-950/80 text-emerald-200': t.type === 'success',
        'border-accent-500/30 bg-ink-800/90 text-slate-200': t.type === 'info',
      }"
          x-transition
        >
          <i
            :data-lucide="t.type === 'error' ? 'alert-circle' : t.type === 'success' ? 'check-circle-2' : 'info'"
            class="mt-0.5 h-4 w-4 shrink-0"
          ></i>
          <span x-text="t.msg"></span>
        </div>
      </template>
    </div>
    <script src="app.js"></script>
  </body>
</html>
