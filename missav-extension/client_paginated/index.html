<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MissAV Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: {
                950: "#0a0c11",
                900: "#0f1218",
                800: "#151a23",
                700: "#1d2430",
                600: "#293241",
              },
              accent: { 400: "#7db4ff", 500: "#5a9cff", 600: "#3b82f6" },
              violet: { 500: "#a78bfa" },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(90,156,255,.25), 0 8px 32px -8px rgba(90,156,255,.45)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
    ></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-ink-950 text-slate-200 min-h-screen bg-grain antialiased"
    x-data="app()"
    x-init="boot()"
    x-cloak
  >
    <!-- ═══════════════════ TOP NAV ═══════════════════ -->
    <header
      class="sticky top-0 z-30 border-b border-white/5 bg-ink-950/80 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex max-w-[1600px] items-center gap-4 px-4 py-3 md:px-6"
      >
        <a href="/" class="flex shrink-0 items-center gap-2">
          <div
            class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-accent-500 to-violet-500 shadow-glow"
          >
            <i data-lucide="film" class="h-5 w-5 text-white"></i>
          </div>
          <span class="hidden text-lg font-extrabold tracking-tight sm:inline">
            MissAV<span class="text-accent-400">.</span>Explorer
          </span>
        </a>

        <form
          @submit.prevent="doSearch()"
          class="flex flex-1 items-center gap-2"
        >
          <div class="relative flex-1 max-w-2xl">
            <i
              data-lucide="search"
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
            ></i>
            <input
              x-ref="searchInput"
              x-model="query"
              @input.debounce.400ms="onQueryInput()"
              type="search"
              placeholder="Describe what you want — try “lonely wife, rainy night”…"
              class="w-full rounded-xl border border-white/10 bg-ink-800/70 py-2.5 pl-10 pr-24 text-sm text-slate-100 placeholder:text-slate-500 transition focus:border-accent-500/60 focus:bg-ink-800 focus:outline-none focus:ring-2 focus:ring-accent-500/30"
            />
            <kbd
              class="pointer-events-none absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-md border border-white/10 bg-ink-900 px-1.5 py-0.5 text-[10px] font-medium text-slate-500 sm:inline"
              >/</kbd
            >
          </div>
          <button
            type="submit"
            class="hidden items-center gap-1.5 rounded-xl bg-accent-500 px-4 py-2.5 text-sm font-semibold text-ink-950 shadow-glow transition hover:bg-accent-400 active:scale-[.98] sm:flex"
          >
            <i data-lucide="sparkles" class="h-4 w-4"></i> Search
          </button>
          <button
            type="button"
            @click="doBrowse()"
            class="hidden items-center gap-1.5 rounded-xl border border-white/10 px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-white/20 hover:bg-white/5 md:flex"
          >
            <i data-lucide="layout-grid" class="h-4 w-4"></i> Browse
          </button>
          <button
            type="button"
            @click="toggleClusterMode()"
            :class="mode === 'clustered'
              ? 'bg-violet-500 text-ink-950 shadow-glow'
              : 'border border-white/10 text-slate-300 hover:border-white/20 hover:bg-white/5'"
            class="hidden items-center gap-1.5 rounded-xl px-4 py-2.5 text-sm font-semibold transition md:flex"
            :title="mode === 'clustered' ? 'Exit grouped view' : 'Group results into topics'"
          >
            <i data-lucide="layers" class="h-4 w-4"></i>
            <span
              x-text="mode === 'clustered' ? 'Ungroup' : 'Group by topic'"
            ></span>
          </button>
        </form>

        <div class="hidden items-center gap-2 md:flex">
          <span
            class="flex items-center gap-1.5 rounded-full border border-white/10 bg-ink-800/60 px-2.5 py-1 text-[11px] font-medium text-slate-400"
          >
            <span
              class="h-1.5 w-1.5 rounded-full"
              :class="online ? 'bg-emerald-400' : 'bg-rose-500'"
              :class="online ? 'animate-pulse' : ''"
            ></span>
            <span x-text="online ? 'live' : 'offline'"></span>
          </span>
        </div>

        <button
          @click="filtersOpen = !filtersOpen"
          class="rounded-xl border border-white/10 p-2.5 text-slate-300 lg:hidden"
        >
          <i data-lucide="sliders-horizontal" class="h-4 w-4"></i>
        </button>
      </div>
    </header>

    <!-- ═══════════════════ MAIN LAYOUT ═══════════════════ -->
    <div
      class="relative z-10 mx-auto flex max-w-[1600px] gap-6 px-4 py-6 md:px-6"
    >
      <!-- ─── Filter sidebar (unchanged) ─── -->
      <aside
        :class="filtersOpen ? 'fixed inset-0 z-40 flex justify-end bg-black/60 backdrop-blur-sm lg:static lg:z-auto lg:block lg:bg-transparent lg:backdrop-blur-none' : 'hidden lg:block'"
        class="w-full shrink-0 lg:w-72"
      >
        <div
          class="h-full w-full max-w-sm overflow-y-auto border-l border-white/10 bg-ink-900 p-5 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:rounded-2xl lg:border"
        >
          <div class="mb-4 flex items-center justify-between">
            <h2
              class="flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-slate-400"
            >
              <i data-lucide="sliders-horizontal" class="h-4 w-4"></i> Filters
            </h2>
            <button
              @click="filtersOpen = false"
              class="rounded-lg p-1 text-slate-500 hover:bg-white/5 lg:hidden"
            >
              <i data-lucide="x" class="h-5 w-5"></i>
            </button>
          </div>

          <label class="mb-4 block">
            <span class="mb-1.5 block text-xs font-medium text-slate-500"
              >Series code</span
            >
            <div class="relative">
              <i
                data-lucide="tag"
                class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-500"
              ></i>
              <input
                x-model="filters.code"
                @change="
                  filters.code = filters.code
                    .split(',')
                    .map(c => c.trim().toLowerCase())
                    .filter(Boolean)
                    .join(', ');
                  mode === 'clustered' ? fetchClustered() : refetch();
                "
                placeholder="mdyd, sprd…"
                class="w-full rounded-lg border border-white/10 bg-ink-800 py-2 pl-9 pr-3 text-sm text-slate-100 placeholder:text-slate-600 focus:border-accent-500/60 focus:outline-none"
              />
            </div>
            <span class="mt-1 block text-[10px] text-slate-600">
              Comma-separated = match any series
            </span>
          </label>

          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
            >
              <i data-lucide="check-square" class="h-3.5 w-3.5"></i> Data status
            </span>
            <div
              class="flex rounded-lg border border-white/10 bg-ink-800 p-1 text-xs"
            >
              <button
                @click="setCompletionFilter('all')"
                :class="filters.completionFilter === 'all' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                All
              </button>
              <button
                @click="setCompletionFilter('complete')"
                :class="filters.completionFilter === 'complete' ? 'bg-emerald-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Complete
              </button>
              <button
                @click="setCompletionFilter('incomplete')"
                :class="filters.completionFilter === 'incomplete' ? 'bg-amber-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Incomplete
              </button>
            </div>
          </div>

          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
            >
              <i data-lucide="calendar-range" class="h-3.5 w-3.5"></i> Released
              between
            </span>
            <div class="grid grid-cols-2 gap-2">
              <input
                type="date"
                x-model="filters.from"
                @change="mode === 'clustered' ? fetchClustered() : refetch()"
                class="rounded-lg border border-white/10 bg-ink-800 px-2.5 py-2 text-xs text-slate-100 focus:border-accent-500/60 focus:outline-none [color-scheme:dark]"
              />
              <input
                type="date"
                x-model="filters.to"
                @change="mode === 'clustered' ? fetchClustered() : refetch()"
                class="rounded-lg border border-white/10 bg-ink-800 px-2.5 py-2 text-xs text-slate-100 focus:border-accent-500/60 focus:outline-none [color-scheme:dark]"
              />
            </div>
          </div>

          <div class="mb-4">
            <span
              class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-slate-500"
            >
              <i data-lucide="git-merge" class="h-3.5 w-3.5"></i> Genre match
            </span>
            <div
              class="flex rounded-lg border border-white/10 bg-ink-800 p-1 text-xs"
            >
              <button
                @click="filters.genresMode = 'any'; mode === 'clustered' ? fetchClustered() : refetch()"
                :class="filters.genresMode === 'any' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                Any of
              </button>
              <button
                @click="filters.genresMode = 'all'; mode === 'clustered' ? fetchClustered() : refetch()"
                :class="filters.genresMode === 'all' ? 'bg-accent-500 text-ink-950' : 'text-slate-400 hover:text-slate-200'"
                class="flex-1 rounded-md py-1.5 font-semibold transition"
              >
                All of
              </button>
            </div>
          </div>

          <div class="mb-4">
            <span
              class="mb-2 flex items-center gap-1.5 text-xs font-medium text-slate-500"
            >
              <i data-lucide="drama" class="h-3.5 w-3.5"></i> Genres
              <span
                class="ml-auto text-[10px] text-slate-600"
                x-text="`${filters.genres.length} selected`"
              ></span>
            </span>
            <div class="flex flex-wrap gap-1.5">
              <template x-for="g in facets.genres" :key="g.name">
                <button
                  @click="toggleGenre(g.name)"
                  :class="filters.genres.includes(g.name)
                    ? 'border-accent-500 bg-accent-500/15 text-accent-300'
                    : 'border-white/10 bg-ink-800 text-slate-400 hover:border-white/20 hover:text-slate-200'"
                  class="rounded-full border px-2.5 py-1 text-[11px] font-medium transition"
                  :title="`${g.count.toLocaleString()} videos`"
                >
                  <span x-text="g.name"></span>
                </button>
              </template>
            </div>
          </div>

          <div class="mb-4">
            <span
              class="mb-2 flex items-center gap-1.5 text-xs font-medium text-slate-500"
            >
              <i data-lucide="calendar" class="h-3.5 w-3.5"></i> Quick year
            </span>
            <div class="flex flex-wrap gap-1">
              <template x-for="y in recentYears()" :key="y.year">
                <button
                  @click="pickYear(y.year)"
                  :class="filters.from === y.year+'-01-01' && filters.to === y.year+'-12-31'
                    ? 'border-violet-500 bg-violet-500/20 text-violet-300'
                    : 'border-white/10 bg-ink-800 text-slate-400 hover:text-slate-200'"
                  class="rounded-md border px-2 py-1 text-[11px] font-medium transition"
                  :title="`${y.count.toLocaleString()} videos`"
                  x-text="y.year"
                ></button>
              </template>
            </div>
          </div>

          <button
            @click="clearFilters()"
            class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-lg border border-white/10 py-2 text-xs font-semibold text-slate-400 transition hover:border-rose-500/40 hover:bg-rose-500/10 hover:text-rose-300"
          >
            <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i> Clear all
            filters
          </button>
        </div>
      </aside>

      <!-- ─── Results ─── -->
      <section class="min-w-0 flex-1">
        <!-- result header -->
        <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight text-slate-100">
              <template x-if="mode === 'search'">
                <span
                  >Results for
                  <span class="text-accent-400" x-text="`“${lastQuery}”`"></span
                ></span>
              </template>
              <template x-if="mode === 'clustered'">
                <span class="flex items-center gap-2">
                  <i data-lucide="layers" class="h-6 w-6 text-violet-400"></i>
                  <span>
                    <span x-show="lastQuery">Grouped results for </span>
                    <span
                      x-show="lastQuery"
                      class="text-accent-400"
                      x-text="`“${lastQuery}”`"
                    ></span>
                    <span x-show="!lastQuery">Browse by topic</span>
                  </span>
                </span>
              </template>
              <template x-if="mode === 'similar'">
                <span class="flex items-center gap-2"
                  ><i data-lucide="orbit" class="h-6 w-6 text-violet-400"></i>
                  Similar videos</span
                >
              </template>
              <template x-if="mode === 'browse'">
                <span class="flex items-center gap-2"
                  ><i
                    data-lucide="layout-grid"
                    class="h-6 w-6 text-accent-400"
                  ></i>
                  Browse</span
                >
              </template>
            </h1>
            <p class="mt-1 text-sm text-slate-500">
              <template x-if="mode === 'clustered'">
                <span>
                  <span x-text="clustered.data?.total_results ?? 0"></span>
                  results ·
                  <span x-text="clustered.data?.n_clusters ?? 0"></span> groups
                  <template x-if="(clustered.data?.n_noise ?? 0) > 0">
                    <span class="text-slate-600">
                      · <span x-text="clustered.data.n_noise"></span> outliers
                    </span>
                  </template>
                  <span
                    x-show="lastTook != null"
                    class="text-slate-600"
                    x-text="` · ${lastTook?.toFixed(0)} ms`"
                  ></span>
                </span>
              </template>
              <template x-if="mode !== 'clustered'">
                <span>
                  <span x-text="items.length"></span> loaded
                  <span
                    x-show="exhausted && items.length"
                    class="text-slate-600"
                  >
                    · end of results</span
                  >
                  <span
                    x-show="lastTook != null"
                    class="text-slate-600"
                    x-text="` · ${lastTook?.toFixed(0)} ms`"
                  ></span>
                </span>
              </template>
            </p>
          </div>

          <!-- active filter pills -->
          <div class="flex flex-wrap items-center gap-1.5">
            <!--
              Clustered-mode config.
              No "groups" field — the server picks k. Instead we expose the
              cluster_utils knobs: min_cluster_size (-s), epsilon (-e),
              candidate pool, and candidate_source when the query is blank.
            -->
            <div
              x-show="mode === 'clustered'"
              class="inline-flex flex-wrap items-center gap-1.5 rounded-full border border-violet-500/30 bg-violet-500/10 px-2.5 py-1 text-[11px] font-medium text-violet-200"
            >
              <i data-lucide="layers" class="h-3 w-3"></i>

              <!-- Presets -->
              <select
                @change="applyClusterPreset($event.target.value); $event.target.value = ''"
                class="cursor-pointer rounded bg-ink-900/80 px-1.5 py-0.5 text-[11px] font-medium text-violet-100 focus:outline-none [color-scheme:dark]"
                title="Preset for min_cluster_size / epsilon"
              >
                <option value="">Preset…</option>
                <option value="tight">Tight groups</option>
                <option value="balanced">Balanced</option>
                <option value="loose">Loose groups</option>
              </select>

              <span class="text-violet-400/60">|</span>
              <label
                class="flex items-center gap-1"
                title="min_cluster_size (-s)"
              >
                min size
                <input
                  type="number"
                  min="2"
                  max="20"
                  x-model.number="clusterPrefs.minClusterSize"
                  @change="applyClusterPrefs()"
                  class="w-10 rounded bg-ink-900/80 px-1 py-0.5 text-center text-[11px] text-violet-100 focus:outline-none"
                />
              </label>
              <span class="text-violet-400/60">|</span>
              <label
                class="flex items-center gap-1"
                title="cluster_selection_epsilon (-e)"
              >
                ε
                <input
                  type="number"
                  min="0"
                  max="1"
                  step="0.05"
                  x-model.number="clusterPrefs.epsilon"
                  @change="applyClusterPrefs()"
                  class="w-14 rounded bg-ink-900/80 px-1 py-0.5 text-center text-[11px] text-violet-100 focus:outline-none"
                />
              </label>
              <span class="text-violet-400/60">|</span>
              <label
                class="flex items-center gap-1"
                title="cluster_candidate_limit — empty = server cap"
              >
                pool
                <input
                  type="number"
                  min="10"
                  max="50000"
                  step="100"
                  placeholder="auto"
                  x-model.number="clusterPrefs.candidateLimit"
                  @change="applyClusterPrefs()"
                  class="w-16 rounded bg-ink-900/80 px-1 py-0.5 text-center text-[11px] text-violet-100 placeholder:text-violet-400/40 focus:outline-none"
                />
              </label>

              <!-- Candidate source — only meaningful when there's no query -->
              <span
                x-show="!lastQuery"
                class="flex items-center gap-1"
                title="Used only when the query is blank"
              >
                <span class="text-violet-400/60">|</span>
                <label class="flex items-center gap-1">
                  pool
                  <select
                    x-model="clusterPrefs.candidateSource"
                    @change="applyClusterPrefs()"
                    class="cursor-pointer rounded bg-ink-900/80 px-1 py-0.5 text-[11px] text-violet-100 focus:outline-none [color-scheme:dark]"
                  >
                    <option value="recent">recent</option>
                    <option value="random">random</option>
                  </select>
                </label>
              </span>
            </div>

            <!-- Sort & Order selector (browse + search) -->
            <div
              x-show="mode === 'browse' || mode === 'search'"
              class="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-ink-800/80 px-2.5 py-1 text-[11px] font-medium text-slate-400"
              :title="mode === 'browse'
                ? 'Sort order'
                : 'Search sort order — choosing \'Newest release\' hides videos without a release date'"
            >
              <i data-lucide="arrow-up-down" class="h-3 w-3"></i>
              <select
                x-model="sort"
                @change="refetch()"
                class="cursor-pointer bg-transparent text-[11px] font-medium text-slate-300 focus:outline-none [color-scheme:dark]"
              >
                <option value="similarity" x-show="mode === 'search'">
                  Most similar
                </option>
                <option value="release_date">Newest release</option>
                <option value="created_at">Recently added</option>
              </select>
              <span class="text-slate-600">|</span>
              <select
                x-model="order"
                @change="refetch()"
                class="cursor-pointer bg-transparent text-[11px] font-medium text-slate-300 focus:outline-none [color-scheme:dark]"
              >
                <option value="desc">Desc</option>
                <option value="asc">Asc</option>
              </select>
            </div>

            <!-- genre pills -->
            <template x-for="g in filters.genres" :key="g">
              <span
                class="inline-flex items-center gap-1 rounded-full bg-accent-500/15 py-0.5 pl-2.5 pr-1 text-[11px] font-medium text-accent-300"
              >
                <span x-text="g"></span>
                <button
                  @click="toggleGenre(g)"
                  class="rounded-full p-0.5 hover:bg-white/10"
                >
                  <i data-lucide="x" class="h-3 w-3"></i>
                </button>
              </span>
            </template>

            <!-- code pill -->
            <template x-if="filters.code">
              <span
                class="inline-flex items-center gap-1 rounded-full bg-violet-500/15 py-0.5 pl-2.5 pr-1 text-[11px] font-medium text-violet-300"
              >
                <span x-text="'code: ' + filters.code"></span>
                <button
                  @click="filters.code = ''; mode === 'clustered' ? fetchClustered() : refetch()"
                  class="rounded-full p-0.5 hover:bg-white/10"
                >
                  <i data-lucide="x" class="h-3 w-3"></i>
                </button>
              </span>
            </template>

            <!-- date pill -->
            <template x-if="filters.from || filters.to">
              <span
                class="inline-flex items-center gap-1 rounded-full bg-emerald-500/15 py-0.5 pl-2.5 pr-1 text-[11px] font-medium text-emerald-300"
              >
                <span
                  x-text="`${filters.from || '…'} → ${filters.to || '…'}`"
                ></span>
                <button
                  @click="filters.from=''; filters.to=''; mode === 'clustered' ? fetchClustered() : refetch()"
                  class="rounded-full p-0.5 hover:bg-white/10"
                >
                  <i data-lucide="x" class="h-3 w-3"></i>
                </button>
              </span>
            </template>

            <!-- completion filter pill -->
            <template x-if="filters.completionFilter !== 'all'">
              <span
                class="inline-flex items-center gap-1 rounded-full bg-emerald-500/15 py-0.5 pl-2.5 pr-1 text-[11px] font-medium text-emerald-300"
              >
                <i
                  :data-lucide="filters.completionFilter === 'complete' ? 'check-circle-2' : 'alert-circle'"
                  class="h-3 w-3"
                ></i>
                <span x-text="filters.completionFilter"></span>
                <button
                  @click="setCompletionFilter('all')"
                  class="rounded-full p-0.5 hover:bg-white/10"
                >
                  <i data-lucide="x" class="h-3 w-3"></i>
                </button>
              </span>
            </template>
          </div>
        </div>

        <!-- ═══════════════════ CLUSTERED RESULTS ═══════════════════ -->
        <div x-show="mode === 'clustered'" x-cloak>
          <!-- skeleton -->
          <div x-show="clustered.loading && !clustered.data" class="space-y-8">
            <template x-for="ci in 3" :key="ci">
              <div>
                <div class="mb-3 h-5 w-64 skeleton rounded"></div>
                <div class="flex gap-4 overflow-hidden">
                  <template x-for="ii in 6" :key="ii">
                    <div
                      class="w-52 shrink-0 overflow-hidden rounded-2xl border border-white/5 bg-ink-900"
                    >
                      <div class="aspect-[4/3] skeleton"></div>
                      <div class="space-y-2 p-3">
                        <div class="h-3 w-4/5 skeleton rounded"></div>
                        <div class="h-2.5 w-2/5 skeleton rounded"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- error -->
          <div
            x-show="clustered.error"
            class="rounded-2xl border border-rose-500/30 bg-rose-950/40 p-4 text-sm text-rose-200"
          >
            <p class="font-semibold">Couldn't group results</p>
            <p class="mt-1 text-rose-300/80" x-text="clustered.error"></p>
            <button
              @click="fetchClustered()"
              class="mt-3 rounded-lg border border-rose-400/40 px-3 py-1.5 text-xs font-semibold hover:bg-rose-500/10"
            >
              Retry
            </button>
          </div>

          <!-- rows -->
          <div
            x-show="!clustered.loading && clustered.data && clustered.data.clusters.length"
            class="space-y-8"
          >
            <template x-for="c in clustered.data.clusters" :key="c.cluster_id">
              <section
                x-show="!clusterUiFor(c.cluster_id).hidden"
                class="cluster-row"
              >
                <!-- cluster header -->
                <header class="mb-3 flex flex-wrap items-center gap-2">
                  <span
                    class="h-2 w-2 shrink-0 rounded-full"
                    :class="clusterTierDotClass(c)"
                  ></span>
                  <h2
                    class="text-sm font-bold tracking-tight text-slate-200"
                    x-text="clusterLabel(c)"
                  ></h2>
                  <span
                    class="flex items-center gap-0.5"
                    :title="`Cohesion ${(c.consistency_score ?? 0).toFixed(2)}`"
                  >
                    <template x-for="s in 5" :key="s">
                      <span
                        class="h-1.5 w-3 rounded-full"
                        :class="s <= clusterSegments(c) ? clusterTierDotClass(c) : 'bg-white/10'"
                      ></span>
                    </template>
                  </span>
                  <span class="text-[11px] text-slate-500">
                    <span x-text="c.size"></span> items
                    <template x-if="(c.misplaced_items_count ?? 0) > 0">
                      <span class="text-amber-400/80">
                        · <span x-text="c.misplaced_items_count"></span> fringe
                      </span>
                    </template>
                  </span>
                  <button
                    @click="toggleClusterCoreOnly(c.cluster_id)"
                    class="ml-auto inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[11px] font-medium transition"
                    :class="clusterUiFor(c.cluster_id).coreOnly
                      ? 'border-emerald-400/40 bg-emerald-500/15 text-emerald-200'
                      : 'border-white/10 text-slate-400 hover:text-slate-200'"
                    title="Hide fringe items"
                  >
                    <i data-lucide="sparkles" class="h-3 w-3"></i>
                    <span
                      x-text="clusterUiFor(c.cluster_id).coreOnly ? 'core only' : 'show core'"
                    ></span>
                  </button>
                  <button
                    @click="toggleClusterHidden(c.cluster_id)"
                    class="rounded-full border border-white/10 p-1 text-slate-400 hover:text-rose-300"
                    :title="clusterUiFor(c.cluster_id).hidden ? 'Show this group' : 'Hide this group'"
                  >
                    <i
                      :data-lucide="clusterUiFor(c.cluster_id).hidden ? 'eye' : 'eye-off'"
                      class="h-3 w-3"
                    ></i>
                  </button>
                </header>

                <!-- horizontal scroller -->
                <div class="carousel-mask">
                  <div class="carousel flex gap-3 overflow-x-auto pb-2">
                    <template
                      x-for="(v, idx) in visibleItems(c)"
                      :key="v.id + '-' + idx"
                    >
                      <article
                        class="card-enter group relative w-52 shrink-0 overflow-hidden rounded-2xl border border-white/5 bg-ink-900 transition-all duration-200 hover:-translate-y-1 hover:border-accent-500/40 hover:shadow-glow"
                        :class="{ 'opacity-60': isFringeItem(v) }"
                        :style="`animation-delay:${Math.min(idx, 10) * 25}ms`"
                      >
                        <div
                          class="relative aspect-[4/3] overflow-hidden bg-ink-800"
                        >
                          <img
                            :src="v.thumbnail"
                            :alt="v.title"
                            loading="lazy"
                            decoding="async"
                            class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
                            @error="$event.target.style.opacity = .2"
                          />
                          <div
                            class="pointer-events-none absolute inset-0 bg-gradient-to-t from-ink-950/90 via-ink-950/10 to-transparent"
                          ></div>
                          <div
                            x-show="v.similarity != null"
                            class="absolute left-2 top-2 flex items-center gap-1 rounded-full bg-ink-950/80 px-2 py-0.5 text-[10px] font-bold text-accent-300 backdrop-blur"
                          >
                            <i data-lucide="target" class="h-3 w-3"></i>
                            <span
                              x-text="(v.similarity * 100).toFixed(0) + '%'"
                            ></span>
                          </div>
                          <div
                            x-show="isCoreItem(v)"
                            class="absolute right-2 top-2 flex items-center gap-0.5 rounded-full bg-emerald-500/90 px-1.5 py-0.5 text-[9px] font-bold text-ink-950"
                            title="Representative of this group"
                          >
                            <i data-lucide="zap" class="h-2.5 w-2.5"></i>
                          </div>
                          <div
                            class="absolute inset-0 flex items-center justify-center gap-2 bg-ink-950/60 opacity-0 backdrop-blur-sm transition group-hover:opacity-100"
                          >
                            <button
                              @click="openDetail(v.id)"
                              class="flex items-center gap-1.5 rounded-full bg-accent-500 px-3 py-1.5 text-xs font-bold text-ink-950 transition hover:scale-105"
                            >
                              <i data-lucide="play" class="h-3.5 w-3.5"></i>
                              Preview
                            </button>
                            <button
                              @click="findSimilarFromCluster(v.id)"
                              class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-xs font-semibold text-white ring-1 ring-white/20 transition hover:bg-white/20"
                            >
                              <i data-lucide="orbit" class="h-3.5 w-3.5"></i>
                            </button>
                          </div>
                        </div>
                        <div class="p-3">
                          <h3
                            @click="openDetail(v.id)"
                            class="line-clamp-2 min-h-[2.4em] cursor-pointer text-[13px] font-semibold leading-snug text-slate-100 transition group-hover:text-accent-300"
                            x-text="v.title || '(untitled)'"
                          ></h3>
                          <div
                            class="mt-1 flex items-center gap-1.5 text-[11px] text-slate-500"
                          >
                            <span
                              class="rounded bg-ink-700 px-1.5 py-0.5 font-mono text-[10px] text-accent-300"
                              x-text="v.code"
                            ></span>
                            <span x-text="v.episode"></span>
                          </div>
                          <div x-show="v.probability != null" class="mt-2">
                            <div
                              class="h-1 w-full overflow-hidden rounded-full bg-white/10"
                            >
                              <div
                                class="h-full rounded-full"
                                :class="clusterTier(c) === 'green'
                                  ? 'bg-emerald-400'
                                  : clusterTier(c) === 'amber'
                                    ? 'bg-amber-400'
                                    : 'bg-slate-500'"
                                :style="`width:${Math.round((v.probability ?? 0) * 100)}%`"
                              ></div>
                            </div>
                          </div>
                          <div class="mt-2 flex flex-wrap gap-1">
                            <template
                              x-for="g in (v.genres ?? []).slice(0, 2)"
                              :key="g"
                            >
                              <span
                                class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-500"
                                x-text="g"
                              ></span>
                            </template>
                            <span
                              x-show="(v.genres?.length ?? 0) > 2"
                              class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-500"
                              x-text="`+${(v.genres?.length ?? 0) - 2}`"
                            ></span>
                          </div>
                        </div>
                      </article>
                    </template>
                    <div
                      x-show="visibleItems(c).length === 0"
                      class="flex h-[220px] w-full items-center justify-center rounded-2xl border border-dashed border-white/10 text-xs text-slate-500"
                    >
                      No core items in this group — turn off “core only”.
                    </div>
                  </div>
                </div>
              </section>
            </template>
          </div>

          <!-- empty -->
          <div
            x-show="!clustered.loading && clustered.data && !clustered.data.clusters.length"
            class="flex flex-col items-center justify-center py-24 text-center"
          >
            <div
              class="grid h-16 w-16 place-items-center rounded-2xl bg-ink-800 text-slate-500"
            >
              <i data-lucide="layers" class="h-8 w-8"></i>
            </div>
            <h3 class="mt-4 text-lg font-semibold text-slate-300">
              Nothing to group
            </h3>
            <p class="mt-1 max-w-sm text-sm text-slate-500">
              Try removing filters, or search for a topic above.
            </p>
            <button
              @click="clearFilters()"
              class="mt-4 rounded-lg border border-white/10 px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-white/5"
            >
              Clear filters
            </button>
          </div>
        </div>

        <!-- ═══════════════════ PAGINATED RESULTS ═══════════════════ -->
        <div x-show="mode !== 'clustered'">
          <div
            x-show="items.length === 0 && loading"
            class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
          >
            <template x-for="i in 10" :key="i">
              <div
                class="overflow-hidden rounded-2xl border border-white/5 bg-ink-900"
              >
                <div class="aspect-[4/3] skeleton"></div>
                <div class="space-y-2 p-3">
                  <div class="h-3 w-4/5 skeleton rounded"></div>
                  <div class="h-2.5 w-2/5 skeleton rounded"></div>
                  <div class="flex gap-1 pt-1">
                    <div class="h-4 w-12 skeleton rounded"></div>
                    <div class="h-4 w-14 skeleton rounded"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div
            x-show="items.length > 0"
            class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
          >
            <template x-for="(v, idx) in items" :key="v.id + '-' + idx">
              <article
                class="card-enter group relative overflow-hidden rounded-2xl border border-white/5 bg-ink-900 transition-all duration-200 hover:-translate-y-1 hover:border-accent-500/40 hover:shadow-glow"
                :style="`animation-delay:${Math.min(idx, 10) * 25}ms`"
              >
                <div class="relative aspect-[4/3] overflow-hidden bg-ink-800">
                  <img
                    :src="v.thumbnail"
                    :alt="v.title"
                    loading="lazy"
                    decoding="async"
                    class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
                    @error="$event.target.style.opacity = .2"
                  />
                  <div
                    class="pointer-events-none absolute inset-0 bg-gradient-to-t from-ink-950/90 via-ink-950/10 to-transparent"
                  ></div>
                  <div
                    x-show="v.similarity != null"
                    class="absolute left-2 top-2 flex items-center gap-1 rounded-full bg-ink-950/80 px-2 py-0.5 text-[10px] font-bold text-accent-300 backdrop-blur"
                  >
                    <i data-lucide="target" class="h-3 w-3"></i>
                    <span x-text="(v.similarity * 100).toFixed(0) + '%'"></span>
                  </div>
                  <div
                    x-show="v.release_date"
                    class="absolute right-2 top-2 rounded-full bg-ink-950/80 px-2 py-0.5 text-[10px] font-bold text-slate-300 backdrop-blur"
                    x-text="v.release_date?.slice(0,4)"
                  ></div>
                  <div
                    class="absolute inset-0 flex items-center justify-center gap-2 bg-ink-950/60 opacity-0 backdrop-blur-sm transition group-hover:opacity-100"
                  >
                    <button
                      @click="openDetail(v.id)"
                      class="flex items-center gap-1.5 rounded-full bg-accent-500 px-3 py-1.5 text-xs font-bold text-ink-950 transition hover:scale-105"
                    >
                      <i data-lucide="play" class="h-3.5 w-3.5"></i> Preview
                    </button>
                    <button
                      @click="findSimilar(v.id)"
                      class="flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-xs font-semibold text-white ring-1 ring-white/20 transition hover:bg-white/20"
                    >
                      <i data-lucide="orbit" class="h-3.5 w-3.5"></i>
                    </button>
                  </div>
                </div>
                <div class="p-3">
                  <h3
                    @click="openDetail(v.id)"
                    class="line-clamp-2 min-h-[2.4em] cursor-pointer text-[13px] font-semibold leading-snug text-slate-100 transition group-hover:text-accent-300"
                    x-text="v.title || '(untitled)'"
                  ></h3>
                  <div
                    class="mt-1 flex items-center gap-1.5 text-[11px] text-slate-500"
                  >
                    <span
                      class="rounded bg-ink-700 px-1.5 py-0.5 font-mono text-[10px] text-accent-300"
                      x-text="v.code"
                    ></span>
                    <span x-text="v.episode"></span>
                  </div>
                  <div class="mt-2 flex flex-wrap gap-1">
                    <template
                      x-for="g in (v.genres ?? []).slice(0, 2)"
                      :key="g"
                    >
                      <span
                        class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-500"
                        x-text="g"
                      ></span>
                    </template>
                    <span
                      x-show="(v.genres?.length ?? 0) > 2"
                      class="rounded-full bg-ink-800 px-2 py-0.5 text-[10px] text-slate-500"
                      x-text="`+${(v.genres?.length ?? 0) - 2}`"
                    ></span>
                  </div>
                </div>
              </article>
            </template>
          </div>

          <div
            x-show="!loading && items.length === 0"
            class="flex flex-col items-center justify-center py-24 text-center"
          >
            <div
              class="grid h-16 w-16 place-items-center rounded-2xl bg-ink-800 text-slate-500"
            >
              <i data-lucide="ghost" class="h-8 w-8"></i>
            </div>
            <h3 class="mt-4 text-lg font-semibold text-slate-300">
              No results
            </h3>
            <p class="mt-1 max-w-sm text-sm text-slate-500">
              Try removing some filters, or rephrase your query.
            </p>
            <button
              @click="clearFilters()"
              class="mt-4 rounded-lg border border-white/10 px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-white/5"
            >
              Clear filters
            </button>
          </div>

          <div
            x-show="items.length > 0"
            class="mt-8 flex flex-col items-center gap-4"
          >
            <button
              x-show="!exhausted"
              @click="loadMore()"
              :disabled="loading"
              class="flex items-center gap-2 rounded-xl border border-white/10 bg-ink-800 px-5 py-2.5 text-sm font-semibold text-slate-200 transition hover:border-accent-500/40 hover:bg-ink-700 disabled:opacity-50"
            >
              <template x-if="loading"
                ><i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i
              ></template>
              <template x-if="!loading"
                ><i data-lucide="chevron-down" class="h-4 w-4"></i
              ></template>
              <span x-text="loading ? 'Loading…' : 'Load more'"></span>
            </button>
            <p x-show="exhausted" class="text-xs text-slate-600">
              — you've reached the end —
            </p>
          </div>
        </div>

        <div x-ref="sentinel" class="h-1"></div>
      </section>
    </div>

    <!-- ═══════════════════ DETAIL MODAL ═══════════════════ -->
    <div
      x-show="detail.open"
      x-cloak
      class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop"
      @click.self="closeDetail()"
      x-transition.opacity
    >
      <div
        class="relative w-full max-w-3xl overflow-hidden rounded-2xl border border-white/10 bg-ink-900 shadow-2xl"
        x-transition.scale.origin.center
      >
        <button
          @click="closeDetail()"
          class="absolute right-3 top-3 z-10 grid h-9 w-9 place-items-center rounded-full bg-ink-950/80 text-slate-300 backdrop-blur transition hover:bg-rose-500/30 hover:text-rose-300"
        >
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
        <template x-if="detail.loading">
          <div class="aspect-video skeleton"></div>
        </template>
        <template x-if="detail.video">
          <div>
            <div class="aspect-video bg-black">
              <template x-if="detail.video.preview">
                <video
                  :src="detail.video.preview"
                  :poster="detail.video.thumbnail"
                  controls
                  autoplay
                  muted
                  playsinline
                  class="h-full w-full object-contain"
                ></video>
              </template>
              <template x-if="!detail.video.preview">
                <img
                  :src="detail.video.thumbnail"
                  class="h-full w-full object-contain"
                />
              </template>
            </div>
            <div class="max-h-[50vh] overflow-y-auto p-5">
              <div class="mb-2 flex items-center gap-2 text-xs text-slate-500">
                <span
                  class="rounded bg-ink-800 px-2 py-0.5 font-mono text-accent-300"
                  x-text="detail.video.code"
                ></span>
                <span x-text="detail.video.episode"></span>
                <span
                  x-show="detail.video.release_date"
                  x-text="'· ' + detail.video.release_date?.slice(0,10)"
                ></span>
              </div>
              <h2
                class="text-xl font-bold text-slate-100"
                x-text="detail.video.title || '(untitled)'"
              ></h2>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <template x-for="g in (detail.video.genres || [])" :key="g">
                  <span
                    @click="closeDetail(); filters.genres=[g]; mode === 'clustered' ? fetchClustered() : refetch()"
                    class="cursor-pointer rounded-full border border-white/10 bg-ink-800 px-2.5 py-0.5 text-[11px] text-slate-400 transition hover:border-accent-500/40 hover:text-accent-300"
                    x-text="g"
                  ></span>
                </template>
              </div>
              <p
                x-show="detail.video.details"
                class="mt-4 whitespace-pre-wrap text-sm leading-relaxed text-slate-400"
                x-text="detail.video.details"
              ></p>
              <div class="mt-5 flex flex-wrap gap-2">
                <a
                  :href="detail.video.url"
                  target="_blank"
                  rel="noopener"
                  class="flex items-center gap-1.5 rounded-lg bg-accent-500 px-4 py-2 text-sm font-bold text-ink-950 transition hover:bg-accent-400"
                >
                  <i data-lucide="external-link" class="h-4 w-4"></i> Open
                  source
                </a>
                <button
                  @click="findSimilar(detail.video.id)"
                  class="flex items-center gap-1.5 rounded-lg border border-white/10 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-white/5"
                >
                  <i data-lucide="orbit" class="h-4 w-4"></i> Find similar
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ═══════════════════ TOASTS ═══════════════════ -->
    <div
      class="pointer-events-none fixed bottom-4 right-4 z-[60] flex flex-col gap-2"
    >
      <template x-for="t in toasts" :key="t.id">
        <div
          class="pointer-events-auto flex items-start gap-2 rounded-xl border px-3 py-2.5 text-sm shadow-lg backdrop-blur-md"
          :class="{
            'border-rose-500/30 bg-rose-950/80 text-rose-200': t.type === 'error',
            'border-emerald-500/30 bg-emerald-950/80 text-emerald-200': t.type === 'success',
            'border-accent-500/30 bg-ink-800/90 text-slate-200': t.type === 'info',
          }"
          x-transition
        >
          <i
            :data-lucide="t.type === 'error' ? 'alert-circle' : t.type === 'success' ? 'check-circle-2' : 'info'"
            class="mt-0.5 h-4 w-4 shrink-0"
          ></i>
          <span x-text="t.msg"></span>
        </div>
      </template>
    </div>

    <script src="app.js"></script>
  </body>
</html>
