<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissAV Topic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <div class="container mx-auto p-6">
      <header class="mb-8 border-b pb-4 border-gray-200">
        <h1 class="text-3xl font-bold text-indigo-600">
          📊 MissAV Topic Dashboard
        </h1>
        <p class="text-gray-500 mt-2">
          Latest topic modeling results across all series codes.
        </p>
      </header>

      <!-- Dashboard Grid -->
      <div
        id="dashboardGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"
      >
        <!-- Cards will be injected here -->
      </div>

      <!-- Detail View (Hidden by default) -->
      <div
        id="detailView"
        class="hidden bg-white p-6 rounded-lg shadow-lg border border-indigo-100"
      >
        <div class="flex justify-between items-center mb-6">
          <h2 id="detailTitle" class="text-2xl font-bold text-gray-800"></h2>
          <button
            onclick="closeDetails()"
            class="text-gray-500 hover:text-red-500"
          >
            ✕ Close
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">
            <div id="wordChart" class="w-full h-96"></div>
          </div>
          <div class="lg:col-span-1">
            <h3 class="font-bold text-gray-700 mb-3">Representative Docs</h3>
            <div
              id="repDocsContainer"
              class="space-y-3 max-h-96 overflow-y-auto pr-2"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
