<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissAV Topic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <div class="container mx-auto p-6 max-w-7xl">
      <header
        class="flex justify-between items-center mb-8 border-b pb-4 border-gray-200"
      >
        <div>
          <h1 class="text-3xl font-bold text-indigo-600">
            📊 MissAV Topic Explorer
          </h1>
          <p class="text-gray-500 text-sm mt-1">
            Semantic analysis of video series by code.
          </p>
        </div>
        <button
          onclick="openModal()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg shadow-md transition flex items-center gap-2"
        >
          <span class="text-xl font-bold">+</span> Analyze New Code
        </button>
      </header>

      <!-- Dashboard Grid -->
      <div
        id="dashboardGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        <!-- Cards injected via JS -->
      </div>

      <!-- Detail View Section -->
      <div
        id="detailView"
        class="hidden mt-10 bg-white p-8 rounded-xl shadow-lg border border-indigo-50 animate-fade-in"
      >
        <div
          class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"
        >
          <div>
            <h2 id="detailTitle" class="text-2xl font-bold text-gray-800"></h2>
            <p id="detailMeta" class="text-gray-500 text-sm"></p>
          </div>

          <!-- Topic Selector -->
          <div
            class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-200"
          >
            <label for="topicSelect" class="text-sm font-semibold text-gray-600"
              >View Topic:</label
            >
            <select
              id="topicSelect"
              onchange="changeTopic(this.value)"
              class="bg-white border-gray-300 text-gray-700 text-sm rounded-md focus:ring-indigo-500 focus:border-indigo-500 block p-2"
            >
              <!-- Options injected via JS -->
            </select>
            <button
              onclick="closeDetails()"
              class="ml-4 text-gray-400 hover:text-red-500 text-2xl"
            >
              &times;
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Chart Section -->
          <div
            class="lg:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-100 relative"
          >
            <h3 class="font-semibold text-gray-700 mb-2 text-center">
              Word Relevance Distribution
            </h3>
            <!-- Fixed height container for ECharts -->
            <div id="wordChart" class="w-full h-[400px]"></div>
          </div>

          <!-- Docs Section -->
          <div class="lg:col-span-1 flex flex-col h-[450px]">
            <h3
              class="font-bold text-gray-700 mb-4 flex justify-between items-center"
            >
              Representative Snippets
              <span
                id="repCountBadge"
                class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full"
                >0</span
              >
            </h3>
            <div
              id="repDocsContainer"
              class="flex-grow space-y-4 overflow-y-auto pr-2 custom-scrollbar"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      id="analysisModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all scale-100"
      >
        <h3 class="text-xl font-bold mb-4 text-gray-800">Start New Analysis</h3>
        <form id="analysisForm" onsubmit="handleSave(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Series Code</label
            >
            <input
              type="text"
              id="inputCode"
              required
              placeholder="e.g. juc, fc2"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2"
            />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700"
                >Topics</label
              >
              <input
                type="number"
                id="inputNTopics"
                value="5"
                min="2"
                max="20"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700"
                >Documents</label
              >
              <input
                type="number"
                id="inputNDocs"
                value="100"
                min="10"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"
              />
            </div>
          </div>
          <div class="flex items-center">
            <input
              type="checkbox"
              id="inputNoLlm"
              class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"
            />
            <label for="inputNoLlm" class="ml-2 block text-sm text-gray-900"
              >Disable LLM Naming (Faster)</label
            >
          </div>
          <div class="mt-6 flex justify-end gap-3">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveBtn"
              class="px-4 py-2 bg-indigo-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-indigo-700 flex items-center"
            >
              <span id="btnText">Start Analysis</span>
              <svg
                id="btnSpinner"
                class="animate-spin ml-2 h-4 w-4 text-white hidden"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
