<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissAV Topic Dashboard</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Apache ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <div class="container mx-auto p-6">
      <header
        class="flex justify-between items-center mb-8 border-b pb-4 border-gray-200"
      >
        <h1 class="text-3xl font-bold text-indigo-600">
          📊 MissAV Topic Explorer
        </h1>
        <div class="flex gap-3">
          <select
            id="codeSelect"
            class="border rounded px-3 py-2 bg-white shadow-sm"
          >
            <option value="">All Codes</option>
            <option value="juc">JUC</option>
            <option value="fc2">FC2</option>
            <option value="nwf">NWF</option>
          </select>
          <button
            onclick="loadRuns()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow transition"
          >
            Load Runs
          </button>
        </div>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Sidebar -->
        <aside class="lg:col-span-1 space-y-6">
          <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
            <h3 class="font-semibold text-gray-500 uppercase text-xs mb-3">
              Topic Runs
            </h3>
            <ul id="runList" class="space-y-2 max-h-60 overflow-y-auto"></ul>
          </div>

          <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
            <h3 class="font-semibold text-gray-500 uppercase text-xs mb-3">
              Topics
            </h3>
            <ul id="topicList" class="space-y-2 max-h-96 overflow-y-auto"></ul>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="lg:col-span-3 space-y-6">
          <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
            <h2 id="currentTopicTitle" class="text-xl font-bold mb-4">
              Select a topic to view details
            </h2>
            <div id="wordChart" class="w-full h-80"></div>
          </div>

          <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4">
              Representative Documents
            </h3>
            <div id="repDocsContainer" class="space-y-3"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
