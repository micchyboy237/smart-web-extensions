<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        padding: 10px;
        width: 300px;
      }
      .section {
        margin-bottom: 15px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      h3 {
        margin-top: 0;
        font-size: 14px;
        color: #333;
      }
      .video-item {
        font-size: 12px;
        margin-bottom: 5px;
      }
      .progress-bar {
        background: #eee;
        height: 5px;
        border-radius: 2px;
        margin-top: 2px;
      }
      .progress-fill {
        background: #4caf50;
        height: 100%;
        width: 0%;
        transition: width 0.3s;
      }
      button {
        background: #4caf50;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 3px;
        font-size: 12px;
      }
      button.cancel {
        background: #f44336;
      }
      button:hover {
        opacity: 0.9;
      }
      #cache-info {
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- Feature 1: Live Ongoing Download Connections -->
    <div class="section">
      <h3>Live Video Downloads</h3>
      <div id="video-list">No active video downloads detected.</div>
    </div>

    <!-- Feature 2: Cancel Ongoing Data Downloads -->
    <div class="section">
      <h3>Active Fetch Requests</h3>
      <div id="fetch-list">No active fetch requests.</div>
    </div>

    <!-- Feature 3: Cache Storage Info -->
    <div class="section">
      <h3>Cache Storage</h3>
      <div id="cache-info">Loading...</div>
      <button id="clear-cache-btn">Clear All Cache</button>
    </div>

    <!-- Feature 7: Offline Playback Prep -->
    <div class="section">
      <h3>Offline Playback</h3>
      <p style="font-size: 12px; color: #666">
        Cache current page videos for offline use.
      </p>
      <button id="cache-current-videos">Cache Current Videos</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
