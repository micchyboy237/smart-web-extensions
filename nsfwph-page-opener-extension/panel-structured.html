<div class="pto-panel-content">
  <h4>
    🔗 Thread Opener
    <span
      class="pto-debug-toggle"
      style="cursor: pointer; font-size: 11px; color: #666; margin-left: 6px"
      >[debug]</span
    >
  </h4>

  <div class="pto-row">
    <label>Page Structure:</label>
    <span
      class="pto-structure-name"
      style="color: #0f3460; font-weight: bold; font-size: 11px"
      >Detecting...</span
    >
  </div>

  <div class="pto-row">
    <label>Current Page Available:</label>
    <span class="pto-available-count" style="color: #e94560; font-weight: bold"
      >-</span
    >
  </div>

  <div class="pto-row">
    <label>Use Target Limit:</label>
    <label class="switch">
      <input type="checkbox" class="pto-limit-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="pto-row pto-target-row" style="display: none">
    <label>Target Tabs:</label>
    <input
      type="number"
      class="pto-target-input"
      value="10"
      min="1"
      max="100"
    />
  </div>

  <div class="pto-row">
    <label>Auto-Close If Reacted:</label>
    <label class="switch">
      <input type="checkbox" class="pto-autoclose-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="pto-row">
    <span class="pto-status">Ready</span>
  </div>

  <pre class="pto-debug-log" style="display: none"></pre>

  <button class="pto-start-btn">Start Opening</button>
  <button class="pto-stop-btn" style="display: none; background: #d9534f">
    Stop
  </button>
</div>
